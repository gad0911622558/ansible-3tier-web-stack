---
# tasks file for roles/appserver
 - name: install Nginx for reverse proxy
   dnf:
     name: nginx 
     state: present

 - name: start and enable nginx 
   service: 
     name: nginx 
     state: started
     enabled: true

 - name: open http port in firewall
   firewalld:
     service: http
     permanent: true 
     state: enabled
     immediate: true

 - name: deploy dynmic index.html 
   template:
     src: proxy.conf.j2
     dest: /etc/nginx/conf.d/proxy.conf
     mode: '0644'
   notify: Restart nginx 
