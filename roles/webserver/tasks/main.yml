---
# tasks file for roles/webserver
 - name: install Nginx server
   dnf:
     name: nginx 
     state: present

 - name: start and enable nginx 
   service: 
     name: nginx 
     state: started
     enabled: true

 - name: open http port in firewall
   firewalld:
     service: http
     permanent: true 
     state: enabled
     immediate: true

 - name: remove default nginx test page
   file: 
     path: /usr/share/nginx/html/index.html
     state: absent
 
 - name: remote default page
   file: 
     path: /etc/nginx/conf.d/default.conf
     state: absent

 - name: deploy dynmic index.html 
   copy:
     src: html.txt
     dest: /usr/share/nginx/html/index.html 
     mode: '0644'
   notify: Restart nginx
